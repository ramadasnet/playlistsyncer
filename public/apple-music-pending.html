<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Apple Music access</title>
        <style>
            body {
                margin: 0;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 24px;
                background: #f7f7f2;
                color: #151814;
                font-family: system-ui, "Segoe UI", sans-serif;
            }
            main {
                width: min(100%, 28rem);
            }
            img {
                display: block;
                width: 48px;
                height: 48px;
            }
            h1 {
                margin: 16px 0 8px;
                font-size: 1.5rem;
                line-height: 1.2;
            }
            p {
                margin: 0;
                line-height: 1.6;
            }
        </style>
    </head>
    <body>
        <main>
            <img src="/logo-mark.svg" alt="" />
            <h1>Apple Music</h1>
            <p>Keep this window open. After you sign in with Apple, it asks for access to your music library.</p>
        </main>
        <script>
            // Heartbeat shared with the login page. The key name matches appleMusicWindowKey in useAppleMusicAuthorization.
            const appleMusicWindowKey = "playlistsyncer.appleMusicWindow"
            function beat() {
                localStorage.setItem(appleMusicWindowKey, String(Date.now()))
            }
            beat()
            const timer = setInterval(beat, 400)
            window.addEventListener("pagehide", () => {
                clearInterval(timer)
                localStorage.removeItem(appleMusicWindowKey)
            })
        </script>
    </body>
</html>
