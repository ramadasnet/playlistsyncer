name: CI

on:
    push:
        branches: [master]
    pull_request:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        services:
            mongodb:
                image: mongo:9
                ports:
                    - 27017:27017
                options: >-
                    --health-cmd "mongosh --quiet --eval 'db.runCommand({ping: 1})'"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 12
        env:
            PLS_MONGODB_URI: mongodb://localhost:27017
            PLS_MONGODB_DATABASE: playlistsyncer-ci
        steps:
            - uses: actions/checkout@v7

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.3

            - name: Install
              run: bun install --frozen-lockfile

            - name: Typecheck
              run: bun run typecheck

            - name: Format
              run: bun run format:check

            - name: Test
              run: bun test

            # A random order catches tests that leak mocks or state into other files. The seed is printed for reproduction.
            - name: Test in random order
              run: bun test --randomize

    docker:
        needs: check
        runs-on: ubuntu-latest
        timeout-minutes: 60
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v7

            - uses: docker/setup-qemu-action@v3
              with:
                  platforms: arm64

            - uses: docker/setup-buildx-action@v3

            - name: Log in to GitHub Container Registry
              if: github.event_name == 'push' && github.ref == 'refs/heads/master'
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Image metadata
              id: metadata
              uses: docker/metadata-action@v5
              with:
                  images: ghcr.io/${{ github.repository }}
                  tags: |
                      type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
                      type=sha
                      type=ref,event=pr

            - name: Build and publish Docker image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  platforms: linux/amd64,linux/arm64
                  push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
                  tags: ${{ steps.metadata.outputs.tags }}
                  labels: ${{ steps.metadata.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
