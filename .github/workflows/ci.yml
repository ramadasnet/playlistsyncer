name: CI

on:
    push:
        branches: [master]
    pull_request:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        services:
            # Runs the MongoDB-backed tests, which are skipped without PLS_MONGODB_URI.
            mongodb:
                image: mongo:8
                ports:
                    - 27017:27017
                options: >-
                    --health-cmd "mongosh --quiet --eval 'db.runCommand({ping: 1})'"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 12
        env:
            PLS_MONGODB_URI: mongodb://localhost:27017
            PLS_MONGODB_DATABASE: playlistsyncer-ci
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  # Keep in sync with the Dockerfile base image.
                  bun-version: 1.4.0

            - name: Install
              run: bun install --frozen-lockfile

            - name: Typecheck
              run: bun run typecheck

            - name: Format
              run: bun run format:check

            - name: Test
              run: bun test

            # A random order catches tests that leak mocks or state into other files. The seed is printed for reproduction.
            - name: Test in random order
              run: bun test --randomize
