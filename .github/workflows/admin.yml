name: Admin CI

on:
    push:
        branches: [master]
        paths: ["admin/**", "server/**", "shared/**", "package.json", "bun.lock", "tests/admin.test.ts", ".github/workflows/admin.yml"]
    pull_request:
        paths: ["admin/**", "server/**", "shared/**", "package.json", "bun.lock", "tests/admin.test.ts", ".github/workflows/admin.yml"]

concurrency:
    group: admin-ci-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.3
            - name: Install
              run: bun install --frozen-lockfile
            - name: Typecheck admin
              run: bun run admin:typecheck
            - name: Test access and mutations
              run: bun test tests/admin.test.ts
            - name: Build admin
              run: bun run admin:build

    docker:
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        needs: check
        runs-on: ubuntu-latest
        timeout-minutes: 60
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v7
            - uses: docker/setup-qemu-action@v3
              with:
                  platforms: arm64
            - uses: docker/setup-buildx-action@v3
            - uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: Image metadata
              id: metadata
              uses: docker/metadata-action@v5
              with:
                  images: ghcr.io/${{ github.repository }}-admin
                  tags: |
                      type=raw,value=latest
                      type=sha
            - name: Build and publish admin image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: admin/Dockerfile
                  platforms: linux/amd64,linux/arm64
                  push: true
                  tags: ${{ steps.metadata.outputs.tags }}
                  labels: ${{ steps.metadata.outputs.labels }}
                  cache-from: type=gha,scope=admin
                  cache-to: type=gha,scope=admin,mode=max
